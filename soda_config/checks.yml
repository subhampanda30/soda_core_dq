checks for customer:
- row_count > 0:
    name: Table customer should not be empty
- change for row_count between -20% and 50%:
    name: Monitor row count changes in customer
- freshness(created_at) < 7d:
    name: Data freshness check for customer
- missing_percent(id) < 25%:
    name: Missing values in id below threshold
- invalid_count(id) = 0:
    name: Validate id range
    valid min: 0.9
    valid max: 7.700000000000001
- invalid_count(id) = 0:
    name: Validate categorical values in id
    valid values:
    - '1'
    - '2'
    - '3'
    - '4'
    - '5'
    - '6'
    - '7'
- min_length(customer_name) >= 4:
    name: Minimum length check for customer_name
- max_length(customer_name) <= 16:
    name: Maximum length check for customer_name
- invalid_count(customer_name) = 0:
    name: Validate categorical values in customer_name
    valid values:
    - John Doe
    - Jane Smith
    - Noah Brown
    - Emily Clark
    - Mike Davis
    - Sarah Lee
